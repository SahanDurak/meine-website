<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- The sketched ._. face from the home intro on a sheet of paper. Colours
       are the paper/ink tokens from app/globals.css (an icon cannot read CSS
       variables); the media query follows the browser's colour scheme. -->
  <style>
    .sheet { fill: #F4EBD7; stroke: #2B2620; stroke-opacity: 0.35; }
    .ink { stroke: #2B2620; }
    @media (prefers-color-scheme: dark) {
      .sheet { fill: #23231D; stroke: #EDE5D2; }
      .ink { stroke: #EDE5D2; }
    }
  </style>
