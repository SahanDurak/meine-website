  <g class="ink" stroke-width="2.6" transform="rotate(-6 16 16)">
    <path d="M10.6 11.4 C 12.2 11.1, 12.6 13.3, 11 13.5 S 9.6 11.9, 10.8 11.7"/>
    <path d="M21.2 11 C 22.8 10.8, 23 13, 21.5 13.1 S 20.3 11.4, 21.4 11.2"/>
